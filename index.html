<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <script src="script/script.js" defer></script>
    <title>Document</title>
</head>
<body>
    <div id="calculator">
        <span id="calcDisplay">000</span>
        <button id="plusSign">+</button>
        <button id="minusSign">-</button>
        <button id="multiplicationSign">x</button>
        <button id="divisionSign">/</button>
        <button id="equalSign">=</button>
        <button id="clearBtn">clear</button>
        <div id="numberPad">
            <button id="btnZero">0</button>
            <button id="btnOne">1</button>
            <button id="btnTwo">2</button>
            <button id="btnThree">3</button>
            <button id="btnFour">4</button>
            <button id="btnFive">5</button>
            <button id="btnSix">6</button>
            <button id="btnSeven">7</button>
            <button id="btnEight">8</button>
            <button id="btnNine">2</button>
        </div>
    </div>
</body>
</html>
